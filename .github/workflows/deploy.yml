name: CI/CD Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/class-rpl2c

jobs:
  # ================= AUTOMATED TESTING =================
  test:
    name: Test (lint, typecheck, build, smoke)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: class_rpl2c
          MYSQL_USER: app
          MYSQL_PASSWORD: app_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://app:app_pass@localhost:3306/class_rpl2c
      JWT_SECRET: ci-secret
      ADMIN_EMAIL: admin@kelas.com
      ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Smoke test (migrate + seed + start + HTTP)
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
          npm run start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ -o /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3000/ | grep -q "SELAMAT DATANG" && echo "HOME OK"
          curl -sf http://localhost:3000/api/galeri -o /dev/null && echo "API OK"
          curl -sf http://localhost:3000/pengumuman/999999 | grep -q "Pengumuman Tidak Ditemukan" && echo "DETAIL OK"

  # ================= BUILD & PUSH IMAGE =================
  build-image:
    name: Build & push image (GHCR)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================= DEPLOY KE VPS =================
  deploy:
    name: Deploy ke VPS
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/rpl2c
            docker compose pull app
            docker compose up -d app
            for i in $(seq 1 12); do
              if docker compose exec -T app wget -q -O /dev/null http://localhost:3000/ 2>/dev/null; then
                echo "DEPLOY OK"
                exit 0
              fi
              sleep 5
            done
            echo "Health check gagal — log aplikasi:"
            docker compose logs app --tail 60
            exit 1
